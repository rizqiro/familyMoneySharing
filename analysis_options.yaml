include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
    avoid_print: true
    unawaited_futures: true

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    # The Firestore rules tests are JavaScript, but firebase-tools ships Dart
    # templates inside its package, and the analyzer walks into them.
    - firebase/rules_test/node_modules/**
